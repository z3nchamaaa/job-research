appId: "com.syukatsu.tracker"
productName: "Syukatsu Tracker"
artifactName: "job-research-${version}-${os}-${arch}.${ext}"
npmRebuild: false
extraMetadata:
  name: "job-research"
directories:
  output: "dist"
files:
  - "desktop/*.cjs"
  - '!desktop/*.test.cjs'
  - "package.json"
  - "LICENSE"
  - '!node_modules/!(jose){,/**/*}'
extraResources:
  - from: "desktop-runtime"
    to: "runtime"
  - from: "desktop-runtime/node_modules"
    to: "runtime/node_modules"
    filter:
      - "**/*"
mac:
  target:
    - target: "dir"
      arch:
        - "arm64"
    - target: "dmg"
      arch:
        - "arm64"
win:
  target:
    - target: "nsis"
      arch:
        - "x64"
        - "arm64"
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: "job-research"
  target:
    - target: "deb"
      arch:
        - "x64"
    - target: "rpm"
      arch:
        - "x64"
  category: "Office"
  maintainer: "z3nchamaaa"
  vendor: "Job Research"
