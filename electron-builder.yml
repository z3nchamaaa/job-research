appId: "com.syukatsu.tracker"
productName: "就活トラッカー"
artifactName: "job-research-${version}-${os}-${arch}.${ext}"
npmRebuild: false
artifactBuildCompleted: "desktop/verify-nsis.cjs"
extraMetadata:
  name: "job-research"
directories:
  output: "dist"
files:
  - "desktop/*.cjs"
  - '!desktop/*.test.cjs'
  - "package.json"
  - "LICENSE"
  - '!node_modules/!(jose){,/**/*}'
extraResources:
  - from: "assets/icons/app-icon.png"
    to: "branding/app-icon.png"
  - from: "desktop-runtime"
    to: "runtime"
  - from: "desktop-runtime/node_modules"
    to: "runtime/node_modules"
    filter:
      - "**/*"
mac:
  icon: "assets/icons/app-icon.icns"
  identity: "-"
  target:
    - target: "dir"
      arch:
        - "arm64"
    - target: "dmg"
      arch:
        - "arm64"
win:
  icon: "assets/icons/app-icon.ico"
  target:
    - target: "nsis"
      arch:
        - "x64"
        - "arm64"
  signExecutable: false
nsis:
  installerIcon: "assets/icons/app-icon.ico"
  uninstallerIcon: "assets/icons/app-icon.ico"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
linux:
  icon: "assets/icons/app-icon.png"
  executableName: "job-research"
  target:
    - target: "deb"
      arch:
        - "x64"
    - target: "rpm"
      arch:
        - "x64"
  category: "Office"
  maintainer: "z3nchamaaa"
  vendor: "Job Research"
