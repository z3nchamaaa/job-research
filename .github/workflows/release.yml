name: Desktop release builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac-arm64
            command: npx electron-builder --mac dmg --arm64 --publish never
            assets: dist/*.dmg
          - runner: windows-2025
            target: win-x64
            command: pwsh -File desktop-webview/build.ps1 -Rid win-x64
            assets: dist/*-win-x64.exe
          - runner: windows-2025
            target: win-arm64
            command: pwsh -File desktop-webview/build.ps1 -Rid win-arm64
            assets: dist/*-win-arm64.exe
          - runner: ubuntu-24.04
            target: linux-x64
            command: npx electron-builder --linux deb rpm --x64 --publish never
            assets: |
              dist/*.deb
              dist/*.rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: npm run desktop:build
      - run: npm run desktop:test
      - run: node desktop/verify-release-runtime.cjs
      - run: ${{ matrix.command }}
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict 'dist/mac-arm64/就活トラッカー.app'
      - if: matrix.target == 'win-x64'
        shell: pwsh
        run: ./desktop-webview/smoke-install.ps1 (Get-Item 'dist/*-win-x64.exe').FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 7
